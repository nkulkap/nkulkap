# Configuration Prometheus de développement : scrape de l'instance Fineract.
global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: fineract
    scheme: https
    metrics_path: /fineract-provider/actuator/prometheus
    tls_config:
      # Certificat auto-signé de Fineract en développement.
      insecure_skip_verify: true
    static_configs:
      - targets: ["fineract:8443"]
