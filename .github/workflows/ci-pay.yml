# Chaîne nkulkap-pay (Java, Gradle) : appelle make test COMPONENT=pay après préparation de l'outillage.
# Logique de build dans le Makefile uniquement (ADR-014). Le composant n'existe pas encore : la chaîne s'ignore tant que services/nkulkap-pay/settings.gradle est absent.
name: ci-pay

on:
  push:
    paths:
      - "services/nkulkap-pay/**"
      - "Makefile"
      - ".github/workflows/ci-pay.yml"
  pull_request:
    paths:
      - "services/nkulkap-pay/**"
      - "Makefile"
      - ".github/workflows/ci-pay.yml"
  workflow_dispatch:

concurrency:
  group: ci-pay-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Garde-fou : le composant n'est pas encore créé tant que son manifeste est absent.
      - id: present
        run: |
          if [ -f services/nkulkap-pay/settings.gradle ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::pay pas encore créé, chaîne ignorée"
          fi

      - uses: actions/setup-java@v6
        if: steps.present.outputs.ok == 'true'
        with:
          distribution: temurin
          java-version: "25"

      # Cache des dépendances et des sorties Gradle, partagé entre les exécutions.
      - uses: gradle/actions/setup-gradle@v6
        if: steps.present.outputs.ok == 'true'

      - name: Tester le composant
        if: steps.present.outputs.ok == 'true'
        run: make test COMPONENT=pay
