# Chaîne Fineract custom : compile et teste les modules core/custom-nkulkap dans le fork Fineract.
# Logique de build dans le Makefile uniquement (ADR-014) : ce workflow prépare l'outillage puis appelle make.
name: ci-core

on:
  push:
    paths:
      - "core/custom-nkulkap/**"
      - "core/fineract"
      - "Makefile"
      - ".github/workflows/ci-core.yml"
  pull_request:
    paths:
      - "core/custom-nkulkap/**"
      - "core/fineract"
      - "Makefile"
      - ".github/workflows/ci-core.yml"
  workflow_dispatch:

concurrency:
  group: ci-core-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          # Historique complet : Fineract calcule sa version par git et échoue sur un clone superficiel.
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      # Cache de ~/.gradle (dépendances, formateurs Spotless, données P2 d'Eclipse) partagé entre les exécutions :
      # une panne d'un dépôt distant ne casse pas le build une fois le cache rempli (ADR-015).
      - uses: gradle/actions/setup-gradle@v6

      - name: Relier les modules NKULKAP à Fineract
        run: make bootstrap

      - name: Compiler et tester les modules NKULKAP
        run: make build

      # Jamais de contrôle sauté en silence : en cas d'échec, dire clairement si un dépôt de formateurs est en panne.
      - name: Diagnostiquer un échec de téléchargement
        if: failure()
        run: |
          if ! curl -sfL --max-time 20 https://download.eclipse.org/eclipse/updates/4.29/p2.index | grep -q 'metadata.repository'; then
            echo "::error::download.eclipse.org est indisponible et le cache ne contient pas les artefacts Eclipse demandés. Relancer quand le site est rétabli ; ne pas désactiver spotless."
          fi
