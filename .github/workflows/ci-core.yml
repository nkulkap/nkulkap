# Chaîne Fineract custom : compile et teste les modules core/custom-nkulkap dans le fork Fineract.
# Logique de build dans le Makefile uniquement (ADR-014) : ce workflow prépare l'outillage puis appelle make.
name: ci-core

on:
  push:
    paths:
      - "core/custom-nkulkap/**"
      - "core/fineract"
      - "Makefile"
      - ".github/workflows/ci-core.yml"
  pull_request:
    paths:
      - "core/custom-nkulkap/**"
      - "core/fineract"
      - "Makefile"
      - ".github/workflows/ci-core.yml"
  workflow_dispatch:

concurrency:
  group: ci-core-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # download.eclipse.org en arrêt temporaire depuis le 2026-10-22 : spotless ne peut pas s'exécuter.
      # Retirer cette ligne dès que le site est rétabli (voir docs/STATUS.md).
      SKIP_SPOTLESS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          # Historique complet : Fineract calcule sa version par git et échoue sur un clone superficiel.
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      # Cache des dépendances et des sorties Gradle, partagé entre les exécutions.
      - uses: gradle/actions/setup-gradle@v6

      - name: Relier les modules NKULKAP à Fineract
        run: make bootstrap

      - name: Compiler et tester les modules NKULKAP
        run: make build
