# Chaîne nkulkap-field (application Android, Java 21, Gradle) : appelle make test COMPONENT=field après préparation de l'outillage.
# Logique de build dans le Makefile uniquement (ADR-014). Le composant n'existe pas encore : la chaîne s'ignore tant que apps/nkulkap-field/settings.gradle.kts est absent.
name: ci-field

on:
  push:
    paths:
      - "apps/nkulkap-field"
      - "apps/nkulkap-field/**"
      - "Makefile"
      - ".github/workflows/ci-field.yml"
  pull_request:
    paths:
      - "apps/nkulkap-field"
      - "apps/nkulkap-field/**"
      - "Makefile"
      - ".github/workflows/ci-field.yml"
  workflow_dispatch:

concurrency:
  group: ci-field-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      # Garde-fou : le composant n'est pas encore créé tant que son manifeste est absent.
      - id: present
        run: |
          if [ -f apps/nkulkap-field/settings.gradle.kts ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::field pas encore créé, chaîne ignorée"
          fi

      - uses: actions/setup-java@v6
        if: steps.present.outputs.ok == 'true'
        with:
          distribution: temurin
          java-version: "21"

      # Cache des dépendances et des sorties Gradle, partagé entre les exécutions.
      - uses: gradle/actions/setup-gradle@v6
        if: steps.present.outputs.ok == 'true'

      - name: Tester le composant
        if: steps.present.outputs.ok == 'true'
        run: make test COMPONENT=field
