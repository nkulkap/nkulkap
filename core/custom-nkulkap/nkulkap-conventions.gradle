// Conventions communes aux modules Fineract NKULKAP, appliquées par chaque build.gradle :
//     apply from: "${rootDir}/custom/nkulkap/nkulkap-conventions.gradle"
// Elles remplacent, pour nos seuls modules, des réglages de Fineract qui ne conviennent pas à du code propriétaire (ADR-015).

def nkulkapHeader = '''/*
 * Copyright (c) $YEAR Circaura Sarl. Tous droits réservés.
 * Logiciel propriétaire NKULKAP : voir le fichier LICENSE à la racine du dépôt.
 */
'''

// L'audit Apache RAT exige l'en-tête de licence de la fondation Apache, qui ne s'applique pas au code NKULKAP.
tasks.named('rat') {
    enabled = false
}

spotless {
    // Java : palantir-java-format, distribué par Maven Central (aucune dépendance à download.eclipse.org),
    // et en-tête propriétaire au lieu de l'en-tête Apache imposé par Fineract.
    java {
        clearSteps()
        importOrder()
        removeUnusedImports()
        palantirJavaFormat('2.102.0')
        licenseHeader(nkulkapHeader)
    }
    // Fichiers Gradle : règles d'espacement de Fineract, sans le formateur Eclipse (greclipse).
    groovyGradle {
        clearSteps()
        leadingTabsToSpaces(4)
        endWithNewline()
        trimTrailingWhitespace()
    }
    // Fineract ajoute l'en-tête Apache aux XML, .properties, .vm et .jsp : retiré pour nos modules.
    ['licenseXml', 'licenseProperties', 'licenseVelocity', 'licenseJsp'].each { name ->
        format(name) {
            clearSteps()
        }
    }
}

// Couverture (JaCoCo) : le plugin est appliqué par Fineract à tous ses sous-projets. Rapports XML et HTML après chaque
// `test` ; `check` échoue si moins de 90 % des lignes sont couvertes. Un module dont le code n'est qu'un câblage Spring
// peut désactiver la vérification avec `ext.nkulkapSkipCoverageCheck = true` avant d'appliquer ce fichier.
tasks.named('test') {
    finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.named('jacocoTestCoverageVerification') {
    dependsOn tasks.named('test')
    violationRules {
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.90
            }
        }
    }
    enabled = !(project.findProperty('nkulkapSkipCoverageCheck') ?: false)
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification')
}
