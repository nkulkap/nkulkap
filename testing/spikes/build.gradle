plugins {
    id 'java'
}

// Jar des schémas Avro de Fineract ; ExternalEventsSpikeIT est sauté s'il manque.
def avroSchemasJar = fileTree(dir: '../../core/fineract/fineract-avro-schemas/build/libs', include: 'fineract-avro-schemas-*.jar',
        exclude: '*-sources.jar')

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.0.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.22.3'
    testImplementation 'org.apache.kafka:kafka-clients:4.2.1'
    testImplementation 'org.apache.avro:avro:1.12.1'
    // Classes Avro générées par Fineract (construites avec l'image : ./gradlew :custom:docker:jibDockerBuild).
    testImplementation files(avroSchemasJar)
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

// Ces tests visent la pile démarrée (make up && make seed) : jamais lancés par `build` ni par la CI.
test {
    enabled = false
}

tasks.register('spikeTest', Test) {
    description = 'Tests d\'exploration de la Phase 1 contre la pile locale'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    maxHeapSize = '256m'
    // Certificat autosigné de la pile locale (CN différent de localhost).
    systemProperty 'jdk.internal.httpclient.disableHostnameVerification', 'true'
    // Relancer à chaque fois : le résultat dépend de la pile, pas des sources.
    outputs.upToDateWhen { false }
    systemProperties System.getProperties().findAll { it.key.toString().startsWith('nkulkap.') }
    testLogging {
        events 'passed', 'failed', 'skipped', 'standard_out'
        exceptionFormat 'full'
        showStandardStreams = true
    }
}
